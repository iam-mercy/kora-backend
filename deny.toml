# cargo-deny — supply-chain policy for kora-backend.
#
# Checked in CI by the `cargo-deny` job in .github/workflows/ci.yml. The job's
# check list widens one section at a time as this file is filled in; bans are
# the last layer still to land. Run `cargo deny check` locally before touching
# a dependency.

[graph]
# Resolve the crate graph with every feature on, so the policy sees the same
# dependency set the sqlx macros and the release build pull in.
all-features = true

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────────────
# Advisories — the RUSTSEC database
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]

# A crate can be yanked upstream with no change on our side, which would turn
# an unrelated PR red. Treat it as a warning and chase it deliberately rather
# than letting it block the queue.
yanked = "warn"

ignore = [
    # Intentionally empty.
    #
    # `cargo audit` used to flag RUSTSEC-2023-0071 (`rsa` "Marvin Attack"
    # timing side-channel) because `rsa` 0.9.x sits in Cargo.lock as a
    # transitive of `sqlx-mysql`. That crate never activates in this
    # Postgres-only build — `cargo tree -i rsa` reports nothing — so
    # cargo-deny's graph-based check does not see it and no ignore is needed.
    #
    # If a future dependency change pulls `rsa` into the real graph this check
    # will start failing. Add the ignore back *here*, with a fresh rationale
    # and a pointer to ASSUMPTIONS.md §15, rather than reaching for a blanket
    # suppression.
]

# ─────────────────────────────────────────────────────────────────────────────
# Sources — where crates are allowed to come from
# ─────────────────────────────────────────────────────────────────────────────
[sources]
# Everything must resolve from crates.io. No git dependencies, no private or
# mirror registries. A `git = "..."` dep in a Cargo.toml fails this check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ─────────────────────────────────────────────────────────────────────────────
# Licenses
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
version = 2
confidence-threshold = 0.9

# SPDX ids accepted without individual review. Every entry is an OSI-approved
# permissive licence or a public-domain-equivalent dedication — no copyleft
# beyond file-scoped MPL, which is not present in the current graph and so is
# deliberately not listed. Adding an id here is a policy change: justify it in
# the commit message.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
