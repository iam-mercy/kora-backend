# Full Phase 1 stack: the kora-2fa service + its Postgres.
#
# `docker compose up` builds the service image, waits for the database to pass
# its healthcheck, then starts kora-2fa on http://localhost:8080.
#
# No Redis service — the 5-failure / 15-minute lockout is implemented with
# Postgres columns on the 2FA record (see ASSUMPTIONS.md #8), so Phase 1 has
# no Redis dependency at all.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora
      POSTGRES_DB: kora_2fa
    ports:
      - "5432:5432"
    volumes:
      - kora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora -d kora_2fa"]
      interval: 5s
      timeout: 5s
      retries: 10

  kora-2fa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override on the CLI, e.g. `docker compose build --build-arg RUST_VERSION=1.99`.
        RUST_VERSION: "1.98"
    image: kora-2fa:local
    container_name: kora-2fa
    ports:
      - "8080:8080"
    # Same knobs as local dev; .env.example is the single source of truth for
    # the non-secret defaults (DB pool sizes, RUST_LOG, TTLs, the dev keys).
    env_file:
      - .env.example
    environment:
      # Reach Postgres through the host's published :5432 rather than over the
      # compose bridge. DNS for the `postgres` service name resolves fine, but
      # some nested/sandboxed Docker setups (Codespaces, certain CI runners)
      # filter container-to-container traffic on user-defined bridges; routing
      # via the host works everywhere, and Postgres already publishes 5432.
      DATABASE_URL: postgresql://kora:kora@host.docker.internal:5432/kora_2fa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kora_pgdata:
